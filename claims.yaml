- id: malafouris-met
  kind: source
  passage: Between these sit the embodied and enactive accounts, for which thinking is an activity of
    the whole acting body in a structured environment [@varela1991; @noe2004; @gallagher2005], and the
    material-engagement account, for which the clay, the wheel, and the abacus are sites where thought
    happens [@malafouris2013].
  evidence:
    citation_id: malafouris2013
    locator: Publisher description (Crossref abstract)
    verified: true
    verification_note: DOI 10.7551/mitpress/9476.001.0001; the description presents Material Engagement
      Theory, adding things and artifacts to the cognitive equation.
- id: tomasello-shared
  kind: source
  passage: The child's brain does not contain physics; the child can be enrolled into the cumulative culture
    that does, through the shared intentionality and high-fidelity social learning that are the specialism
    of the human animal [@tomasello1999; @tomasello2005; @heyes2018; @donald1991].
  evidence:
    citation_id: tomasello2005
    locator: Abstract
    verified: true
    verification_note: DOI 10.1017/S0140525X05000129; the abstract identifies shared intentionality as
      the crucial difference between human cognition and that of other species, enabling cultural cognition
      and evolution.
- id: kirsh-epistemic
  kind: source
  passage: For many advanced tasks the realizing system demonstrably exceeds the individual, in the sense
    that the same person deprived of the notation, the instruments, or the team fails at the task outright
    [@hutchins1995; @kirsh1994].
  evidence:
    citation_id: kirsh1994
    locator: Abstract
    verified: true
    verification_note: DOI 10.1207/s15516709cog1804_1; the abstract shows Tetris players solving problems
      faster by epistemic actions in the world than by computation in the head.
