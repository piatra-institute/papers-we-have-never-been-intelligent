abstract: 'Human cognitive capacities are real and unequal, yet the performances offered as evidence of
  intelligence, in mathematics, physics, law, engineering, administration, and artificial intelligence,
  are seldom produced by an isolated brain. They are realized by assemblages of trained bodies, notations,
  instruments, collaborators, procedures, and inherited institutions, and are then attributed to a single
  named person. We analyse this attribution with Bruno Latour''s account of modernity, in which a public
  doctrine separating nature from society coexists with a practice that multiplies nature-society hybrids.
  An analogous Cognitive Constitution governs intelligence. Institutions depend operationally on cognitive
  hybrids and credit their outputs to bounded individuals through attributional compression, which books
  collaborative production to a genius, an educational infrastructure to an examination score, a software
  ecosystem to a programmer''s talent, and a corpus and a data centre to a model. Separating four referents
  of the folk concept (capacity, performance, realization, and historical possibility) shows psychometrics,
  distributed cognition, and cultural evolution to be accounts of different levels. The argument requires
  only that the realizing system for many advanced tasks exceeds the individual and that purification
  proceeds through observable attribution practices; it sets aside the thesis that artifacts are constitutive
  parts of the mind. A contested proposal, that the capacity to learn is a generic property of mathematical
  structure found by selection, would extend the compression to human biology. Attributional compression
  persists because it is the accounting system of merit: examinations, prizes, wages, and liability each
  require a single body to credit. In its defensible form the thesis is that humans have never been intelligent
  alone.'
web_blurb: Advanced cognitive performances are realized by assemblages of people, notations, instruments,
  and institutions, and then credited to individuals through attributional compression, which persists
