- id: cog-constitution
  kind: definition
  passage: Applied to intelligence, the same analysis yields a parallel settlement, here called the Cognitive
    Constitution.
  rationale: Defines the Cognitive Constitution by analogy with Latour's Modern Constitution.
- id: compression-def
  kind: definition
  passage: We call the mechanism attributional compression.
  rationale: Central definition of the paper.
- id: four-referents
  kind: definition
  passage: Four referents travel under the one word.
  rationale: Introduces the distinction among capacity, performance, realization and historical possibility.
- id: capacity-def
  kind: definition
  passage: The first is capacity, what a person can reliably learn and contribute across situations.
  rationale: Defines capacity as the object of psychometrics.
- id: defensible-thesis
  kind: interpretation
  passage: 'The precise form of the thesis adds one word: we have never been intelligent alone.'
  rationale: States the thesis in its defensible form.
- id: levels-no-conflict
  kind: interpretation
  passage: These are questions about different levels, and the sciences that address them do not conflict.
  rationale: Interpretive reconciliation of psychometrics, distributed cognition and cultural evolution.
- id: modest-claim
  kind: assumption
  passage: The argument therefore relies on the modest claim, which the critics also grant.
  rationale: The argument assumes only that realizing systems exceed individuals for many advanced tasks;
    it sets aside the constitution thesis.
- id: asymmetry
  kind: interpretation
  passage: The case of intelligence is asymmetric, because the purified pole is a person, and institutions
    have strong and independent reasons to require persons.
  rationale: Explains why Latour's symmetry does not transfer.
- id: accounting
  kind: interpretation
  passage: The Cognitive Constitution functions as an accounting system, and what it accounts for is merit.
  rationale: Functional explanation of the persistence of individual attribution.
- id: free-lunch-status
  kind: interpretation
  passage: On the unsettled side, the strongest claims, the near-optimality of random networks and the
    assertion that mathematics and not biology drives the ratchet, have so far been presented in talks
    and work in progress, and the metaphysics of a literal realm from which forms ingress is contested
    and probably unfalsifiable.
  rationale: 'Evidential status of the free-lunch hypothesis: strongest claims presented only in talks
    and work in progress.'
- id: deflationary
  kind: assumption
  passage: Only the first reading, the precise claim, is used here.
  rationale: The argument uses only the deflationary reading of the free-lunch hypothesis.
- id: biology-kept
  kind: assumption
  passage: It does not deny biology, although Section 8 qualifies the standing of biology.
  rationale: The thesis retains a located, unequal biological fact of enrollability.
- id: differences-kept
  kind: interpretation
  passage: It does not abolish individual differences; it specifies what they are differences in.
  rationale: Reinterprets measured variance as a purified residue.
- id: ai-parity
  kind: interpretation
  passage: The parity is in the bookkeeping.
  rationale: Scope of the comparison between human and artificial intelligence.
- id: never-alone
  kind: normative
  passage: In its defensible form the thesis is that humans have never been intelligent alone.
  rationale: Concluding thesis of the paper.
