- id: hutchins-dc
  kind: source
  passage: The distributed-cognition tradition named the largest, cognitive systems spanning many people
    and artifacts that compute what no member computes alone [@hutchins1995; @hollan2000].
  evidence:
    citation_id: hutchins1995
    locator: Publisher description (Crossref abstract)
    verified: true
    verification_note: DOI 10.7551/mitpress/1881.001.0001; the description argues that cultural activity
      systems such as a navigation team have cognitive properties different from those of the individuals
      in them.
