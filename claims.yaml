  evidence:
    citation_id: pigozzi2026
    locator: Abstract (arXiv 2605.06746)
    verified: true
    verification_note: The arXiv abstract states that causal emergence of RL agents was predictive of
      final reward early in training (the Causally Emergent Alignment Hypothesis).
- id: hoel2013-ce
