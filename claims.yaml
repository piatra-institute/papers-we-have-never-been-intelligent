- id: pigozzi2025-ce
  kind: source
  passage: On the published side, @pigozzi2025 report that associative conditioning raises integrative
    causal emergence in gene-regulatory network models, and they propose a feedback loop, which they name
    an intelligence ratchet, in which emergence improves learning and learning in turn raises emergence;
    @pigozzi2026 find that the same measure of causal emergence predicts the final reward of reinforcement-learning
    agents.
  evidence:
    citation_id: pigozzi2025
    locator: Abstract; Discussion
    verified: true
    verification_note: DOI 10.1038/s42003-025-08411-2; the abstract reports increased causal emergence
      after training in 29 biological GRNs, and the open-access text proposes a feedback loop in which
      causal emergence improves learning, 'leading to an intelligence ratchet'.
- id: pigozzi2026-rl
  kind: source
  passage: On the published side, @pigozzi2025 report that associative conditioning raises integrative
    causal emergence in gene-regulatory network models, and they propose a feedback loop, which they name
    an intelligence ratchet, in which emergence improves learning and learning in turn raises emergence;
    @pigozzi2026 find that the same measure of causal emergence predicts the final reward of reinforcement-learning
